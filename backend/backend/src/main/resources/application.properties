spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance_tracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration=PT1H
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Daily local/always-on processing. Vercel uses an external cron request instead.
recurring.scheduler.enabled=${RECURRING_SCHEDULER_ENABLED:true}
recurring.scheduler.cron=${RECURRING_SCHEDULER_CRON:0 0 3 * * *}
recurring.scheduler.zone=${RECURRING_SCHEDULER_ZONE:America/Toronto}
recurring.scheduler.max-catch-up=${RECURRING_SCHEDULER_MAX_CATCH_UP:100}

# Optional narrative layer. Credentials are server-only; never expose them as NEXT_PUBLIC variables.
ai.insights.enabled=${AI_INSIGHTS_ENABLED:false}
ai.insights.api-key=${AI_INSIGHTS_API_KEY:${GEMINI_API_KEY:}}
ai.insights.model=${AI_INSIGHTS_MODEL:gemini-3.5-flash-lite}
ai.insights.endpoint=${AI_INSIGHTS_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
ai.insights.max-output-length=${AI_INSIGHTS_MAX_OUTPUT_LENGTH:1000}
ai.insights.max-output-tokens=${AI_INSIGHTS_MAX_OUTPUT_TOKENS:384}
ai.insights.timeout=${AI_INSIGHTS_TIMEOUT:8s}
ai.insights.cache-ttl=${AI_INSIGHTS_CACHE_TTL:10m}
ai.insights.min-request-interval=${AI_INSIGHTS_MIN_REQUEST_INTERVAL:30s}
ai.insights.max-cache-users=${AI_INSIGHTS_MAX_CACHE_USERS:256}

# Temporary diagnostics for the production /api/auth/** 403 investigation.
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.web.access.ExceptionTranslationFilter=DEBUG
logging.level.org.springframework.security.web.access.intercept.AuthorizationFilter=DEBUG
logging.level.org.springframework.security.web.csrf.CsrfFilter=DEBUG
logging.level.org.springframework.web.cors.DefaultCorsProcessor=DEBUG
