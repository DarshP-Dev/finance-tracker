# Never inherit DB_URL/DB_PASSWORD or provider credentials for test persistence.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://127.0.0.1:1/ft_test_not_configured}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
app.database.migration-mode=migrate
recurring.scheduler.enabled=false
market-data.enabled=false
market-data.api-key=
ai.insights.enabled=false
ai.insights.api-key=
app.security.jwt.secret=disposable-database-test-only-secret-32-bytes
logging.level.org.springframework.security=INFO
